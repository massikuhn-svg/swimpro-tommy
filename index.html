<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SwimPro Tommy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #030712; color: #f9fafb; padding-bottom: 60px; font-size: 14px; }
        header { background: #0284c7; padding: 16px; text-align: center; color: #fff; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 20px; font-weight: 900; }
        .xp-card { background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 8px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
        .xp-bar-bg { width: 50%; height: 8px; background: #374151; border-radius: 4px; overflow: hidden; }
        .xp-bar-fill { height: 100%; width: 50%; background: #fbbf24; }
        
        nav { background: #0b0f19; display: flex; overflow-x: auto; position: sticky; top: 78px; z-index: 90; border-bottom: 1px solid #1f2937; }
        .nav-btn { flex: 1; min-width: 80px; padding: 12px; background: none; border: none; color: #9ca3af; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .nav-btn.active { color: #38bdf8; border-bottom: 3px solid #0284c7; background: #111827; }
        
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card-title { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; }
        
        .timer-display { font-size: 40px; font-weight: bold; color: #38bdf8; text-align: center; font-family: monospace; margin: 15px 0; }
        .btn { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-success { background: #22c55e; }
        .btn-danger { background: #ef4444; }
    </style>
</head>
<body>

    <header>
        <h1>🏊‍♂️ SwimPro Tommy</h1>
        <div class="xp-card">
            <span style="color: #fbbf24; font-weight: bold;">Level <span id="user-level">1</span></span>
            <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill"></div></div>
            <span id="xp-text" style="font-size: 11px;">100 / 200 XP</span>
        </div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="showTab('ziele', event)">🎯 Ziele</button>
        <button class="nav-btn" onclick="showTab('timer', event)">⏱️ Timer</button>
        <button class="nav-btn" onclick="showTab('quiz', event)">🧩 Quiz</button>
    </nav>

    <div class="container">
        <!-- TAB 1: ZIELE -->
        <div id="tab-ziele" class="tab-content active">
            <div class="card">
                <div class="card-title">⏱️ Bestzeiten & Renntaktik</div>
                <p style="color: #9ca3af; margin-bottom: 10px;">Willkommen in Tommy's Schwimm-Hub!</p>
            </div>
        </div>

        <!-- TAB 2: TIMER -->
        <div id="tab-timer" class="tab-content">
            <div class="card">
                <div class="card-title">⏱️ Beckenrand Stoppuhr</div>
                <div class="timer-display" id="timer-val">00:00.0</div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-success" onclick="startTimer()">Start</button>
                    <button class="btn btn-danger" onclick="stopTimer()">Stopp</button>
                </div>
                <button class="btn" style="background: #374151;" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- TAB 3: QUIZ -->
        <div id="tab-quiz" class="tab-content">
            <div class="card">
                <div class="card-title">🧩 Schwimm Quiz</div>
                <p id="quiz-q" style="font-weight: bold; margin-bottom: 10px;">Wie weit darfst du unter Wasser bleiben?</p>
                <button class="btn" style="background: #1f2937;" onclick="alert('Richtig! 15m ist das Limit.')">15 Meter</button>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabId, e) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            if(e) e.currentTarget.classList.add('active');
        }

        let timerInterval, timerTime = 0;
        function startTimer() {
            clearInterval(timerInterval);
            const start = Date.now() - timerTime;
            timerInterval = setInterval(() => {
                timerTime = Date.now() - start;
                const m = Math.floor(timerTime / 60000).toString().padStart(2, '0');
                const s = Math.floor((timerTime % 60000) / 1000).toString().padStart(2, '0');
                const ms = Math.floor((timerTime % 1000) / 100);
                document.getElementById('timer-val').innerText = `${m}:${s}.${ms}`;
            }, 100);
        }
        function stopTimer() { clearInterval(timerInterval); }
        function resetTimer() { clearInterval(timerInterval); timerTime = 0; document.getElementById('timer-val').innerText = '00:00.0'; }
    </script>
</body>
</html>
