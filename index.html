<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SwimPro Tommy - Ultimate Performance Hub</title>
    <meta name="theme-color" content="#0284c7">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #030712; color: #f9fafb; padding-bottom: 60px; font-size: 14px; line-height: 1.6; }
        
        header { background: linear-gradient(135deg, #0284c7, #0369a1, #0f172a); padding: 20px 16px; text-align: center; box-shadow: 0 4px 25px rgba(2, 132, 199, 0.4); position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #38bdf8; }
        header h1 { font-size: 22px; color: #fff; font-weight: 900; letter-spacing: 0.8px; }
        header p { font-size: 12px; color: #7dd3fc; font-weight: 800; margin-top: 2px; }

        .xp-card { background: rgba(3, 7, 18, 0.7); border: 1px solid #0284c7; border-radius: 10px; padding: 8px 12px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; }
        .xp-title { font-size: 11px; font-weight: 900; color: #fbbf24; text-transform: uppercase; }
        .xp-bar-bg { width: 50%; height: 8px; background: #1f2937; border-radius: 4px; overflow: hidden; }
        .xp-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #fbbf24, #f59e0b); border-radius: 4px; transition: width 0.3s; }

        nav { background: #0b0f19; border-bottom: 2px solid #1f2937; display: flex; overflow-x: auto; position: sticky; top: 108px; z-index: 90; scrollbar-width: none; }
        nav::-webkit-scrollbar { display: none; }
        .nav-btn { flex: 1; min-width: 90px; padding: 12px 8px; background: none; border: none; color: #9ca3af; font-size: 11px; font-weight: 800; text-align: center; white-space: nowrap; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.25s ease; }
        .nav-btn.active { color: #38bdf8; border-bottom-color: #0284c7; background: linear-gradient(180deg, rgba(56, 189, 248, 0.05), rgba(56, 189, 248, 0.15)); }

        .container { max-width: 720px; margin: 0 auto; padding: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 18px; margin-bottom: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
        .card-title { font-size: 17px; font-weight: 900; color: #38bdf8; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2937; padding-bottom: 8px; }
        .section-title { font-size: 14px; font-weight: 900; color: #fbbf24; margin: 18px 0 10px 0; border-bottom: 1px dashed #374151; padding-bottom: 4px; }

        .hero-img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 14px; border: 1px solid #374151; }

        .quote-box { background: linear-gradient(135deg, rgba(2, 132, 199, 0.25), rgba(15, 23, 42, 0.95)); border-left: 5px solid #0284c7; padding: 14px; border-radius: 10px; margin-bottom: 18px; }
        .quote-text { font-style: italic; font-size: 13px; color: #f3f4f6; font-weight: 600; }
        .quote-author { font-style: normal; font-weight: 800; color: #38bdf8; font-size: 11px; margin-top: 6px; display: block; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        label { font-size: 11px; color: #9ca3af; font-weight: 800; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #374151; background-color: #030712; color: #ffffff; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #0284c7; }

        .btn-primary { width: 100%; padding: 13px; background: linear-gradient(135deg, #0284c7, #0369a1); color: #ffffff; border: none; border-radius: 8px; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4); }
        .btn-secondary { width: 100%; padding: 10px; background: #1f2937; color: #38bdf8; border: 1px solid #374151; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; margin-top: 6px; }

        .timer-display { font-size: 44px; font-weight: 900; color: #38bdf8; text-align: center; font-family: monospace; letter-spacing: 2px; margin: 12px 0; }
        .timer-controls { display: flex; gap: 8px; }

        .article-box { background: #030712; border: 1px solid #1f2937; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
        .article-title { font-size: 15px; font-weight: 900; color: #38bdf8; margin-bottom: 6px; }
        .article-body { font-size: 13px; color: #d1d5db; line-height: 1.6; }
        .article-body ul { margin-left: 18px; margin-top: 6px; }

        .badge-grid { display: flex; flex-direction: column; gap: 8px; }
        .badge-card { display: flex; align-items: center; gap: 12px; background: #030712; border: 1px solid #1f2937; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
        .badge-icon { font-size: 24px; width: 36px; text-align: center; }
        .badge-info { flex: 1; }
        .badge-name { font-weight: 900; color: #f3f4f6; font-size: 13px; }
        .badge-desc { font-size: 11px; color: #9ca3af; margin-top: 2px; }
        .badge-card input[type="checkbox"] { width: 20px; height: 20px; accent-color: #0284c7; }

        .check-item { display: flex; align-items: flex-start; gap: 10px; background: #030712; border: 1px solid #1f2937; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .check-item input { width: 18px; height: 18px; accent-color: #0284c7; margin-top: 2px; }
        .check-text { font-size: 13px; flex: 1; }
        .check-title { font-weight: 900; color: #f3f4f6; display: block; font-size: 13px; }
        .check-sub { font-size: 11px; color: #9ca3af; display: block; margin-top: 2px; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; margin-top: 8px; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #1f2937; }
        th { color: #38bdf8; background: #030712; font-weight: 900; }
        td.highlight { color: #38bdf8; font-weight: 900; }
    </style>
</head>
